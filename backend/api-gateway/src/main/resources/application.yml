server:
  port: ${API_GATEWAY}

spring:
# JWT Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # API Routes
            - id: iam-service
#              uri: http://localhost:${IAM_SERVICE}
              uri: http://iam-service:${IAM_SERVICE}
              predicates:
                - Path=/api/iam/**
              filters:
                - StripPrefix=1
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials

            - id: vendor-service
#              uri: http://localhost:${VENDOR_SERVICE}
              uri: http://vendor-service:${VENDOR_SERVICE}
              predicates:
                - Path=/api/vendor/**
              filters:
                - StripPrefix=1
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials

            - id: menu-service
#              uri: http://localhost:${MENU_SERVICE}
              uri: http://menu-service:${MENU_SERVICE}
              predicates:
                - Path=/api/menu/**
              filters:
                - StripPrefix=1
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials

            - id: order-service
#              uri: http://localhost:${ORDER_SERVICE}
              uri: http://order-service:${ORDER_SERVICE}
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=1
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Credentials

            # API Documentation Routes (no StripPrefix — services use context-path)
            - id: iam-service-api-docs
              uri: http://iam-service:${IAM_SERVICE}
              predicates:
                - Path=/iam/v3/api-docs

            - id: vendor-service-api-docs
              uri: http://vendor-service:${VENDOR_SERVICE}
              predicates:
                - Path=/vendor/v3/api-docs

            - id: menu-service-api-docs
              uri: http://menu-service:${MENU_SERVICE}
              predicates:
                - Path=/menu/v3/api-docs

            - id: order-service-api-docs
              uri: http://order-service:${ORDER_SERVICE}
              predicates:
                - Path=/order/v3/api-docs

  application:
    name: api-gateway

frontend:
  url: ${FRONTEND_URL}

# SpringDoc configuration
springdoc:
  swagger-ui:
    urls:
      - name: IAM Service
        url: /iam/v3/api-docs
      - name: Vendor Service
        url: /vendor/v3/api-docs
      - name: Order Service
        url: /order/v3/api-docs
      - name: Menu Service
        url: /menu/v3/api-docs
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: true

logging:
  level:
    org:
      springframework:
        cloud:
          gateway: DEBUG
    root: INFO
